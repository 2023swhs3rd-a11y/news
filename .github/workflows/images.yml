name: 기사 이미지 가져오기

# 원고(data/issues/<발행일>.json)의 image.query·image.file 로 위키미디어 공용에서 자유 이용 이미지를 내려받아
# assets/img/<발행일>/ 에 넣고, 출처·라이선스를 원고에 적어 같은 브랜치에 커밋한다. 원고 PR 브랜치에서 실행한다.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "발행일 (YYYY-MM-DD)"
        required: true
      force:
        description: "이미 받은 이미지도 다시 받기 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 이미지 찾기·내려받기
        env:
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: python scripts/images.py --date "$DATE" $([ "$FORCE" = true ] && echo --force)
      - name: 검사
        run: python scripts/build.py --check
      - name: 커밋
        env:
          DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img data/issues
          git diff --cached --quiet && exit 0
          git commit -m "기사 이미지 가져오기 ($DATE)" -m "$(cat .images-report.txt)"
          git push
