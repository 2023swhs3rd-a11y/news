name: 주간 헤드라인 수집

on:
  schedule:
    # 매주 일요일 19:07 KST (10:07 UTC)
    - cron: "7 10 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "발행일 (YYYY-MM-DD, 비우면 다음 월요일)"
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 헤드라인 수집
        run: python scripts/collect.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: 원자료 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet && exit 0
          git commit -m "주간 헤드라인 원자료 수집"
          git push
